name: Monitoramento - Acidentes BR-116

on:
  schedule:
    - cron: "20 5 * * 1,5"      # Segunda e sexta às 05:20 (UTC)
  workflow_dispatch:            # Execução manual

jobs:
  monitoramento:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      # Dependências de sistema necessárias para InformationValue e libs antigas
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev

      # Instalação explícita das dependências do InformationValue
      - name: Install R packages
        run: |
          Rscript -e "install.packages(c('dotenv','httr','jsonlite','dplyr','lubridate','pROC'), repos='https://cloud.r-project.org')"
          Rscript -e "install.packages(c('Hmisc','gplots','ROCR','caTools','bitops'), repos='https://cloud.r-project.org')"
          Rscript -e "install.packages('InformationValue', repos='https://cloud.r-project.org')"

      - name: Run script monitoramento
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: Rscript scripts/03-Monitoramento-Modelo-Preditivo.R